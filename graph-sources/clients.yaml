# customer_id	      string	    Unique UUID or slug
# name	            string	    Display name (e.g., "APC Asphalt Paving")
# business_type	    string	    "asphalt_contractor", "arborist", etc.
# owner	            string	    Business owner name
# industry	        string	    NAICS or industry slug
# website_url	      string	    Homepage
# contact_phone	    string	    Main phone number
# main_address_id	  string	    Location node ID (see Location file)
# service_area_ids	array	      List of location IDs served
# active_services	  array	      List of service IDs
# client_size	      string	    small,medium,large,x-large estimated revenue size
# onboarding_date	  date	      Date added to system
# notes	            text	      Freeform annotations


